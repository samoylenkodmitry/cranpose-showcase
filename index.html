<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="app-icon.png" />
  <title>Showcase Cranpose</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05060c;
      overscroll-behavior: none;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    /* The only page furniture: what the browser shows while the WebAssembly
       bundle is still downloading, and the message if it never starts. It is
       removed from the document the moment the app takes the canvas. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
      background: #05060c;
      color: #e9edf5;
      font: 400 0.9rem/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #boot .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(233, 237, 245, 0.18);
      border-top-color: #8e7cff;
      animation: spin 0.9s linear infinite;
    }

    #boot .detail {
      max-width: 320px;
      color: #9aa3bd;
    }

    #boot.error .detail {
      color: #ff8a8a;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <canvas id="cranpose-showcase-canvas"></canvas>
  <div id="boot">
    <div class="spinner"></div>
    <div class="detail">Loading Showcase Cranpose&hellip;</div>
  </div>

  <script type="module">
    const boot = document.getElementById("boot");

    function fail(message) {
      boot.classList.add("error");
      boot.querySelector(".spinner").remove();
      boot.querySelector(".detail").textContent = message;
    }

    async function main() {
      const hasWebGpu = typeof navigator !== "undefined" && "gpu" in navigator;
      const probe = document.createElement("canvas");
      const hasWebGl2 = !!probe.getContext("webgl2");
      if (!hasWebGpu && !hasWebGl2) {
        throw new Error("Neither WebGPU nor WebGL2 is available in this browser.");
      }

      const wasm = await import("./pkg/cranpose_showcase.js");
      await wasm.default();
      await wasm.run_app();
      boot.remove();
    }

    main().catch((error) => {
      console.error(error);
      fail(String(error && error.message ? error.message : error));
    });
  </script>
</body>
</html>

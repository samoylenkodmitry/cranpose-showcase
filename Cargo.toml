[package]
name = "cranpose-showcase"
version = "0.1.31"
edition = "2021"
description = "A cross-platform showcase of the Cranpose UI framework"
license = "Apache-2.0"
repository = "https://github.com/samoylenkodmitry/cranpose-showcase"
publish = false

# `-ocimfs=100` keeps wasm-opt from folding each function that has a single
# caller into that caller, whatever its size. A page compiles a function whole
# at its first call, so those folds made large functions whose unused branches
# a first visit compiled (Cranpose#1408).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "-ocimfs=100", "--all-features"]

# The Apple Watch app, built by Cranpose's watchOS packager (see
# `watchos/build.py`). It runs `watch::WatchShowcase`, and the iPhone app
# carries it in its `Watch` folder: its bundle id is the iPhone app's with
# `.watchkitapp` after it. It also runs without the iPhone app.
[package.metadata.cranpose.watchos]
entry = "watch::WatchShowcase"
bundle-id = "io.cranpose.showcase.watchkitapp"
companion = "io.cranpose.showcase"
name = "Showcase"
icon = "assets/app-icon-1024.png"
info-plist = { WKRunsIndependentlyOfCompanionApp = true }

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "cranpose-showcase"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "cranpose-showcase-ios"
path = "src/ios_main.rs"
required-features = ["ios"]

# Headless visual QA only: renders the real widgets through Cranpose's Robot
# driver and dumps PNGs, so shader/layout work can be reviewed without a
# visible window or OS screen-recording permission. Not part of any shipped
# target's default features.
[[bin]]
name = "robot-planet-gallery"
path = "robot-runners/robot_planet_gallery.rs"
required-features = ["robot-preview"]

[[bin]]
name = "robot-app-screens"
path = "robot-runners/robot_app_screens.rs"
required-features = ["robot-preview"]

[[bin]]
name = "robot-saved-removal"
path = "robot-runners/robot_saved_removal.rs"
required-features = ["robot-preview"]

[[bin]]
name = "robot-wide-layout"
path = "robot-runners/robot_wide_layout.rs"
required-features = ["robot-preview"]

[[bin]]
name = "robot-tab-switch"
path = "robot-runners/robot_tab_switch.rs"
required-features = ["robot-preview"]

[features]
default = ["renderer-wgpu", "desktop"]
renderer-pixels = ["cranpose/renderer-pixels"]
renderer-wgpu = ["cranpose/renderer-wgpu"]
desktop = ["cranpose/desktop"]
android = ["cranpose/android"]
ios = ["renderer-wgpu", "cranpose/ios"]
web = ["cranpose/web", "dep:wasm-bindgen", "dep:wasm-logger"]
logging = ["dep:env_logger"]
# Makes the watch app the root composable: the Wear OS app (`android/wear`)
# and the desktop preview of the watch app (`cargo run --features watch`).
watch = []
robot-preview = ["desktop", "renderer-wgpu", "logging", "cranpose/robot", "dep:image"]

[dependencies]
coroflow = "0.17.1"
cranpose = "0.17.1"
cranpose-core = "0.17.1"
cranpose-animation = "0.17.1"
cranpose-coroflow = "0.17.1"
cranpose-foundation = "0.17.1"
cranpose-navigation = "0.17.1"
cranpose-ui = "0.17.1"
cranpose-ui-graphics = "0.17.1"
log = "0.4"
wasm-bindgen = { version = "0.2", optional = true }
wasm-logger = { version = "0.2", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Performance",
    "MouseEvent",
    "Touch",
    "TouchList",
    "TouchEvent",
    "PointerEvent",
    "WheelEvent",
    "KeyboardEvent",
    "CssStyleDeclaration",
    "Navigator",
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
] }

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4.79"

[workspace]

[profile.release]
lto = true
codegen-units = 1

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"

[dev-dependencies]
cranpose-testing = "0.17.1"

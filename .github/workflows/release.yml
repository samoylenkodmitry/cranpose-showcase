name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Verify release version
        run: ./scripts/verify-release-version.sh "$GITHUB_REF_NAME"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: cranpose-showcase
            extension: tar.gz
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            executable: cranpose-showcase
            extension: tar.gz
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: cranpose-showcase.exe
            extension: zip
    steps:
      - uses: actions/checkout@v6
      - name: Give curl the token for the GitHub API
        if: runner.os == 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/curl-github-token.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --bin cranpose-showcase --target ${{ matrix.target }}
      - name: Package release binary
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXECUTABLE: ${{ matrix.executable }}
          EXTENSION: ${{ matrix.extension }}
          TARGET: ${{ matrix.target }}
        run: |
          package="cranpose-showcase-${VERSION}-${PLATFORM}"
          mkdir -p release-assets "$package"
          cp "target/${TARGET}/release/${EXECUTABLE}" "$package/"
          cp README.md LICENSE "$package/"
          if [ "$EXTENSION" = zip ]; then
            powershell -Command "Compress-Archive -Path '$package/*' -DestinationPath 'release-assets/$package.zip'"
          else
            tar -czf "release-assets/$package.tar.gz" "$package"
          fi
      - name: Publish desktop artifact
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*

  web:
    name: Web bundle
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build the web bundle
        run: ./build-web.sh
      - name: Package the web bundle
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir -p release-assets
          (cd dist && zip -qr "../release-assets/cranpose-showcase-${VERSION}-web.zip" .)
      - name: Publish web artifact
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true

  android:
    name: Android and Wear OS APKs
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android NDK and cargo-ndk
        run: ./scripts/install-android-ndk.sh
      - name: Build the release APKs
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease
      - name: Stage the APKs
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir -p release-assets
          for apk in android/app/build/outputs/apk/release/*.apk; do
            name="$(basename "$apk" .apk)"
            cp "$apk" "release-assets/cranpose-showcase-${VERSION}-android-${name}.apk"
          done
          for apk in android/wear/build/outputs/apk/release/*.apk; do
            name="$(basename "$apk" .apk)"
            cp "$apk" "release-assets/cranpose-showcase-${VERSION}-wearos-${name#wear-}.apk"
          done
      - name: Publish Android artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true

  ios:
    name: iOS device and simulator
    needs: create-release
    # The image with Xcode 27, whose watchOS 27 SDK the App Store asks of an
    # arm64 watch app.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-watchos
      - name: Build iOS app bundles
        run: |
          PROFILE=release WITH_WATCH=1 ./ios/build-app.sh aarch64-apple-ios
          PROFILE=release ./ios/build-app.sh aarch64-apple-ios-sim
      - name: Package iOS artifacts
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir -p release-assets staging/Payload
          cp -R target/aarch64-apple-ios/release/CranposeShowcase.app staging/Payload/
          (cd staging && zip -qry "../release-assets/cranpose-showcase-${VERSION}-ios-unsigned.ipa" Payload)
          (cd target/aarch64-apple-ios-sim/release && zip -qry "../../../release-assets/cranpose-showcase-${VERSION}-ios-simulator.app.zip" CranposeShowcase.app)
      - name: Publish iOS artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*

  watchos:
    name: Apple Watch device and simulator
    needs: create-release
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-watchos,aarch64-apple-watchos-sim
      - name: Build the watch apps
        run: |
          python3 watchos/build.py --target device
          python3 watchos/build.py --target simulator
      - name: Package the watch apps
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir -p release-assets
          (cd target/watchos/device && zip -qry "$GITHUB_WORKSPACE/release-assets/cranpose-showcase-${VERSION}-watchos-unsigned.app.zip" CranposeWatch.app)
          (cd target/watchos/simulator && zip -qry "$GITHUB_WORKSPACE/release-assets/cranpose-showcase-${VERSION}-watchos-simulator.app.zip" CranposeWatch.app)
      - name: Publish watch artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true

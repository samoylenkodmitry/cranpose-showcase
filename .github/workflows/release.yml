name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
          - label: macos-aarch64
            runner: macos-14

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare artifact name
        id: artifact
        shell: bash
        run: |
          artifact_ref="${GITHUB_REF_NAME//\//-}"
          echo "name=cranpose-showcase-${artifact_ref}-${{ matrix.label }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package binary
        shell: bash
        run: |
          mkdir -p release-root
          cp target/release/cranpose-orbit release-root/
          cp README.md LICENSE release-root/
          tar -czf "${{ steps.artifact.outputs.name }}" -C release-root .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: ${{ steps.artifact.outputs.name }}
          retention-days: 1

  build-web:
    name: Build web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build the web bundle
        run: ./build-web.sh

      - name: Prepare artifact name
        id: artifact
        shell: bash
        run: |
          artifact_ref="${GITHUB_REF_NAME//\//-}"
          echo "name=cranpose-showcase-${artifact_ref}-web.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package web bundle
        run: tar -czf "${{ steps.artifact.outputs.name }}" -C dist .

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: ${{ steps.artifact.outputs.name }}
          retention-days: 1

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Install Android NDK and cargo-ndk
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --locked

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare artifact name
        id: artifact
        shell: bash
        run: |
          artifact_ref="${GITHUB_REF_NAME//\//-}"
          echo "prefix=cranpose-showcase-${artifact_ref}-android" >> "$GITHUB_OUTPUT"

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p assets
          prefix="${{ steps.artifact.outputs.prefix }}"
          # The Cranpose Gradle plugin builds all four Android ABIs on CI
          # (releaseAbis defaults to arm64-v8a/armeabi-v7a/x86/x86_64 whenever
          # $GITHUB_ACTIONS or $CI is set), so AGP's ABI split produces one
          # app-<abi>-release.apk per architecture. Falls back to an
          # unsuffixed name for the single-APK case (no split filename)
          # rather than assuming the "-<abi>-" segment is always present.
          for apk in android/app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk")"
            if [[ "$base" =~ ^app-(.+)-release\.apk$ ]]; then
              cp "$apk" "assets/${prefix}-${BASH_REMATCH[1]}.apk"
            else
              cp "$apk" "assets/${prefix}.apk"
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: assets/*.apk
          retention-days: 1

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-native
      - build-web
      - build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true

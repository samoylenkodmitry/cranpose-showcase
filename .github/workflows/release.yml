name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Verify release version
        run: ./scripts/verify-release-version.sh "$GITHUB_REF_NAME"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: cranpose-showcase
            extension: tar.gz
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            executable: cranpose-showcase
            extension: tar.gz
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: cranpose-showcase.exe
            extension: zip
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --bin cranpose-showcase --target ${{ matrix.target }}
      - name: Package release binary
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXECUTABLE: ${{ matrix.executable }}
          EXTENSION: ${{ matrix.extension }}
          TARGET: ${{ matrix.target }}
        run: |
          package="cranpose-showcase-${VERSION}-${PLATFORM}"
          mkdir -p release-assets "$package"
          cp "target/${TARGET}/release/${EXECUTABLE}" "$package/"
          cp README.md LICENSE "$package/"
          if [ "$EXTENSION" = zip ]; then
            powershell -Command "Compress-Archive -Path '$package/*' -DestinationPath 'release-assets/$package.zip'"
          else
            tar -czf "release-assets/$package.tar.gz" "$package"
          fi
      - name: Publish desktop artifact
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*

  android:
    name: Android APK
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is unavailable}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
          test -n "$sdkmanager" || { echo "Android sdkmanager is unavailable" >&2; exit 1; }
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$sdkmanager" --install "ndk;28.2.13676358"
          cargo install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build Android release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Stage Android APK
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir -p release-assets
          for apk in android/app/build/outputs/apk/release/*.apk; do
            name="$(basename "$apk" .apk)"
            cp "$apk" "release-assets/cranpose-showcase-${VERSION}-android-${name}.apk"
          done
      - name: Publish Android artifact
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true

  ios:
    name: iOS device and simulator
    needs: create-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build iOS app bundles
        run: |
          PROFILE=release ./ios/build-app.sh aarch64-apple-ios
          PROFILE=release ./ios/build-app.sh aarch64-apple-ios-sim
      - name: Package iOS artifacts
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir -p release-assets staging/Payload
          cp -R target/aarch64-apple-ios/release/CranposeShowcase.app staging/Payload/
          (cd staging && zip -qry "../release-assets/cranpose-showcase-${VERSION}-ios-unsigned.ipa" Payload)
          (cd target/aarch64-apple-ios-sim/release && zip -qry "../../../release-assets/cranpose-showcase-${VERSION}-ios-simulator.app.zip" CranposeShowcase.app)
      - name: Publish iOS artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
